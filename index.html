<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="GEAR CONTROL 90° — Inventario y control de equipos fotográficos.">
<link rel="manifest" href="./manifest.webmanifest">
<title>GEAR CONTROL 90°</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#15161a;--panel2:#1c1e23;--line:#2b2d33;--text:#f6f6f7;--muted:#92959e;--green:#42d392;--orange:#ffb454;--red:#ff6b75;--blue:#8ba7ff;--radius:17px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;font-weight:650;background:#f4f4f5;color:#111}button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:#292b31;color:#f5f5f5;border:1px solid var(--line)}button.danger{background:#3a2024;color:#ffb4ba;border:1px solid #66333a}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.small{padding:7px 10px;font-size:12px}
input,select,textarea{width:100%;padding:11px 12px;background:#101115;border:1px solid var(--line);border-radius:11px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#777}textarea{min-height:80px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:#0b0b0df2;backdrop-filter:blur(14px);z-index:10}
.brand{font-weight:850;letter-spacing:.08em;font-size:15px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.2em;margin-top:2px}
.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 68px)}
aside{border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;gap:6px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;color:#aeb0b8;padding:12px;border-radius:11px;font-weight:550}
.nav.active,.nav:hover{background:#202126;color:#fff}.nav .ico{width:20px;text-align:center}
main{padding:28px;max-width:1500px;width:100%;margin:0 auto}
h1{font-size:27px;line-height:1.2;margin:0 0 7px;letter-spacing:-.04em}h2{font-size:17px;margin:0 0 15px}h3{font-size:14px;margin:0 0 10px}.muted{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:.17em;color:var(--muted);font-weight:750}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:23px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.stat .num{font-size:29px;font-weight:780;letter-spacing:-.04em}.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.wrap{flex-wrap:wrap}.stack{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}td .sub{font-size:11px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:750;background:#292b31;color:#c5c7cd}.badge.green{background:#143326;color:var(--green)}.badge.orange{background:#392b18;color:var(--orange)}.badge.red{background:#3b2025;color:var(--red)}.badge.blue{background:#202b47;color:var(--blue)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #3a3c43;border-radius:13px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.open{display:flex}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#17181d;border:1px solid #383a42;border-radius:20px;padding:22px;box-shadow:0 25px 90px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
#reader{width:100%;max-width:500px;margin:12px auto;overflow:hidden;border-radius:13px;background:#050505}#reader video{object-fit:cover}
.scanresult{background:#11271d;border:1px solid #285a43;border-radius:13px;padding:12px;margin-top:12px;display:none}.scanresult.show{display:block}
.eventitem{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.eventitem:last-child{border:0}
.mobilebottom{display:none}.hint{font-size:12px;color:var(--muted);line-height:1.5}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#f4f4f5;color:#111;padding:11px 17px;border-radius:99px;font-weight:700;font-size:13px;z-index:60;display:none;box-shadow:0 8px 30px #0008}.toast.show{display:block}
.qrlabel{display:inline-flex;flex-direction:column;align-items:center;background:white;color:#111;padding:12px;border-radius:8px;margin:7px;text-align:center;width:160px;break-inside:avoid}.qrlabel canvas,.qrlabel img{max-width:130px}.qrlabel b{font-size:12px;margin-top:5px}.qrlabel small{font-size:10px}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:20px 15px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobilebottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111216f5;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20;justify-content:space-around}.mobilebottom .nav{flex-direction:column;gap:3px;text-align:center;font-size:9px;padding:7px 3px;flex:1}.mobilebottom .ico{font-size:17px}.topline{align-items:flex-start}.two,.three{grid-template-columns:1fr 1fr}}
@media(max-width:520px){h1{font-size:23px}.formgrid,.two{grid-template-columns:1fr}.topline{flex-direction:column}.topline .actions{width:100%}.topline .actions button{flex:1}.stat{padding:13px}.stat .num{font-size:25px}.card{padding:15px}}
@media print{body{background:white;color:#111}.no-print{display:none!important}#printArea{display:block!important}.qrlabel{border:1px solid #ddd}}
</style>
</head>
<body>
<header>
 <div class="brand">GEAR CONTROL 90°<small>90° STUDIO MANAGEMENT</small></div>
 <div class="row"><span class="badge green" id="storageStatus">GUARDADO EN ESTE DISPOSITIVO</span><button class="secondary small" onclick="openBackup()">↥ Copia de seguridad</button></div>
</header>
<div class="layout">
<aside id="sidebar"></aside>
<main id="app"></main>
</div>
<nav class="mobilebottom" id="mobileNav"></nav>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Formulario</h2><button class="ghost small" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<div id="printArea" style="display:none"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const KEY='gear_control_90_v1';
const categories=['Cámaras','Lentes','Iluminación LED','Flashes','Trípodes','Estabilizadores','Drones','Baterías','Cargadores','Tarjetas de memoria','Audio','Computación','Accesorios','Maletines','Cables','Otros'];
const navItems=[['dashboard','▦','Dashboard'],['inventory','▣','Inventario'],['scanner','▦','Escáner QR'],['events','◷','Eventos'],['maintenance','⚒','Mantenimiento'],['reports','▤','Reportes'],['settings','⚙','Configuración']];
let state=loadState(), page='dashboard', scanner=null, scanning=false, scanMode='out', activeEventId=null, audioEnabled=false, lastScan='',lastScanAt=0;
function emptyState(){return {assets:[],events:[],maintenance:[],logs:[],settings:{studio:'90gradox Studio',currency:'COP'}}}
function loadState(){try{return {...emptyState(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return emptyState()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));$('storageStatus').textContent='GUARDADO EN ESTE DISPOSITIVO'}
function $(id){return document.getElementById(id)}
function uid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function codeFor(cat){let prefix=({'Cámaras':'CAM','Lentes':'LEN','Iluminación LED':'LED','Flashes':'FLASH','Trípodes':'TRI','Estabilizadores':'EST','Drones':'DRN','Baterías':'BAT','Cargadores':'CAR','Tarjetas de memoria':'MEM','Audio':'AUD','Computación':'PC','Accesorios':'ACC','Maletines':'MAL','Cables':'CAB','Otros':'EQP'})[cat]||'EQP';let n=state.assets.filter(a=>a.code.startsWith(prefix+'-')).length+1;let code;do{code=prefix+'-'+String(n++).padStart(3,'0')}while(state.assets.some(a=>a.code===code));return code}
function qrPayload(a){return 'GEAR90:'+a.id}
function toast(msg){let t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){return s?new Date(s).toLocaleDateString('es-CO'):'—'}
function statusBadge(s){let cls=s==='Disponible'?'green':s==='En uso'?'orange':s==='Mantenimiento'?'red':'blue';return `<span class="badge ${cls}">${esc(s)}</span>`}
function renderNav(){let html=navItems.map(([id,ico,name])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${name}</button>`).join('');$('sidebar').innerHTML=`<div class="eyebrow" style="padding:8px 12px">MENÚ PRINCIPAL</div>${html}<div style="margin-top:auto;padding:12px" class="hint">Inventario privado · Datos locales</div>`;$('mobileNav').innerHTML=navItems.filter(x=>['dashboard','inventory','scanner','events','reports'].includes(x[0])).map(([id,ico,name])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${name}</button>`).join('')}
function go(p){stopScanner();page=p;render()}
function render(){renderNav();let views={dashboard:dashboardView,inventory:inventoryView,scanner:scannerView,events:eventsView,maintenance:maintenanceView,reports:reportsView,settings:settingsView};$('app').innerHTML=(views[page]||dashboardView)()}
function dashboardView(){let total=state.assets.length,available=state.assets.filter(a=>a.status==='Disponible').length,inuse=state.assets.filter(a=>a.status==='En uso').length,repair=state.assets.filter(a=>a.status==='Mantenimiento').length,open=state.events.filter(e=>!['Finalizado','Cancelado'].includes(e.status)).length,missing=state.events.reduce((n,e)=>n+(e.items||[]).filter(i=>i.returned===false).length,0);
return `<div class="topline"><div><div class="eyebrow">PANEL DE CONTROL</div><h1>Resumen del inventario</h1><div class="muted">Controla tus equipos antes y después de cada evento.</div></div><div class="actions"><button onclick="openAssetForm()">＋ Registrar equipo</button><button class="secondary" onclick="go('scanner')">▦ Escanear QR</button></div></div>
<div class="grid"><div class="stat"><div class="num">${total}</div><div class="lbl">Equipos registrados</div></div><div class="stat"><div class="num" style="color:var(--green)">${available}</div><div class="lbl">Disponibles</div></div><div class="stat"><div class="num" style="color:var(--orange)">${inuse}</div><div class="lbl">En eventos</div></div><div class="stat"><div class="num" style="color:var(--red)">${repair+missing}</div><div class="lbl">Mantenimiento / pendientes</div></div></div>
<div class="two"><section class="card"><div class="row"><h2>Eventos activos</h2><button class="secondary small" onclick="openEventForm()">＋ Nuevo</button></div>${state.events.filter(e=>!['Finalizado','Cancelado'].includes(e.status)).slice(0,5).map(e=>`<div class="eventitem"><div><b>${esc(e.name)}</b><div class="sub">${fmtDate(e.date)} · ${(e.items||[]).length} equipos</div></div>${statusBadge(e.status)}</div>`).join('')||'<div class="empty">No hay eventos activos.</div>'}</section>
<section class="card"><h2>Actividad reciente</h2>${state.logs.slice(-6).reverse().map(l=>`<div class="eventitem"><div>${esc(l.text)}<div class="sub">${new Date(l.at).toLocaleString('es-CO')}</div></div></div>`).join('')||'<div class="empty">Todavía no hay movimientos.</div>'}</section></div>
<section class="card"><div class="row"><h2>Accesos rápidos</h2></div><div class="actions"><button onclick="openAssetForm()">Registrar equipo</button><button class="secondary" onclick="openEventForm()">Crear salida</button><button class="secondary" onclick="go('inventory')">Ver inventario</button><button class="secondary" onclick="go('reports')">Exportar datos</button></div></section>`}
function inventoryView(){return `<div class="topline"><div><div class="eyebrow">ACTIVOS</div><h1>Inventario</h1><div class="muted">${state.assets.length} equipos registrados</div></div><div class="actions"><button class="secondary" onclick="printAllQR()">▦ Imprimir QR</button><button onclick="openAssetForm()">＋ Nuevo equipo</button></div></div>
<div class="card"><div class="two"><input id="assetSearch" placeholder="Buscar por nombre, marca, código o serie..." oninput="filterAssets()"><select id="catFilter" onchange="filterAssets()"><option value="">Todas las categorías</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
<div class="card tablewrap"><table><thead><tr><th>Equipo</th><th>Código</th><th>Categoría</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="assetRows">${assetRows(state.assets)}</tbody></table></div>`}
function assetRows(list){if(!list.length)return '<tr><td colspan="5"><div class="empty">No hay equipos. Registra el primero.</div></td></tr>';return list.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="sub">${esc(a.brand||'')} ${esc(a.model||'')}</div></td><td><code>${esc(a.code)}</code></td><td>${esc(a.category)}</td><td>${statusBadge(a.status)}</td><td><div class="actions"><button class="secondary small" onclick="showQR('${a.id}')">QR</button><button class="secondary small" onclick="openAssetForm('${a.id}')">Editar</button><button class="danger small" onclick="deleteAsset('${a.id}')">×</button></div></td></tr>`).join('')}
function filterAssets(){let q=($('assetSearch').value||'').toLowerCase(),c=$('catFilter').value;$('assetRows').innerHTML=assetRows(state.assets.filter(a=>(!c||a.category===c)&&[a.name,a.code,a.brand,a.model,a.serial].join(' ').toLowerCase().includes(q)))}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
function openAssetForm(id){let a=state.assets.find(x=>x.id===id)||{};openModal(id?'Editar equipo':'Registrar equipo',`<form onsubmit="saveAsset(event,'${id||''}')"><div class="formgrid">
<div class="field full"><label>Nombre del equipo *</label><input name="name" required value="${esc(a.name||'')}" placeholder="Ej. Sony A7V"></div>
<div><label>Categoría *</label><select name="category" required>${categories.map(c=>`<option ${a.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div><label>Marca</label><input name="brand" value="${esc(a.brand||'')}"></div>
<div><label>Modelo</label><input name="model" value="${esc(a.model||'')}"></div>
<div><label>Número de serie</label><input name="serial" value="${esc(a.serial||'')}"></div>
<div><label>Fecha de compra</label><input type="date" name="purchaseDate" value="${esc(a.purchaseDate||'')}"></div>
<div><label>Precio de compra (COP)</label><input type="number" min="0" name="price" value="${a.price||''}"></div>
<div><label>Estado físico</label><select name="condition"><option ${a.condition==='Bueno'?'selected':''}>Bueno</option><option ${a.condition==='Excelente'?'selected':''}>Excelente</option><option ${a.condition==='Regular'?'selected':''}>Regular</option><option ${a.condition==='Dañado'?'selected':''}>Dañado</option></select></div>
<div><label>Disponibilidad</label><select name="status"><option ${(!a.status||a.status==='Disponible')?'selected':''}>Disponible</option><option ${a.status==='Mantenimiento'?'selected':''}>Mantenimiento</option></select></div>
<div class="field full"><label>Observaciones</label><textarea name="notes">${esc(a.notes||'')}</textarea></div></div><div class="actions" style="margin-top:17px"><button>Guardar equipo</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}
function saveAsset(ev,id){ev.preventDefault();let f=new FormData(ev.target),a=state.assets.find(x=>x.id===id);let data={name:f.get('name').trim(),category:f.get('category'),brand:f.get('brand'),model:f.get('model'),serial:f.get('serial'),purchaseDate:f.get('purchaseDate'),price:Number(f.get('price')||0),condition:f.get('condition'),status:f.get('status'),notes:f.get('notes')};if(a)Object.assign(a,data);else{a={id:uid(),code:codeFor(data.category),createdAt:new Date().toISOString(),...data};state.assets.push(a)}save();log(`${a.code} · ${a.name} ${id?'actualizado':'registrado'}`);closeModal();render();toast('Equipo guardado')}
function deleteAsset(id){let a=state.assets.find(x=>x.id===id);if(!a)return;if(a.status==='En uso'){toast('No puedes eliminar un equipo que está en uso');return}if(confirm(`¿Archivar/eliminar ${a.name}? Esta acción no se puede deshacer.`)){state.assets=state.assets.filter(x=>x.id!==id);save();render();toast('Equipo eliminado')}}
function showQR(id){let a=state.assets.find(x=>x.id===id);openModal('Código QR · '+a.code,`<div style="text-align:center"><div id="qrOne" style="display:inline-block;background:white;padding:12px;border-radius:8px"></div><h3 style="margin-top:12px">${esc(a.name)}</h3><div class="muted">${esc(a.code)}</div><p class="hint">Este QR identifica únicamente este equipo dentro de GEAR CONTROL 90°.</p><button onclick="downloadQR('${id}')">Descargar PNG</button><button class="secondary" onclick="printSingleQR('${id}')">Imprimir etiqueta</button></div>`);setTimeout(()=>makeQR($('qrOne'),qrPayload(a),180),50)}
function makeQR(el,data,size=140){el.innerHTML='';new QRCode(el,{text:data,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}
function downloadQR(id){let a=state.assets.find(x=>x.id===id),el=document.createElement('div');makeQR(el,qrPayload(a),400);setTimeout(()=>{let img=el.querySelector('img')||el.querySelector('canvas');let url=img.tagName==='CANVAS'?img.toDataURL('image/png'):img.src;let l=document.createElement('a');l.href=url;l.download=`QR-${a.code}.png`;l.click()},100)}
function printSingleQR(id){let a=state.assets.find(x=>x.id===id);printLabels([a])}
function printAllQR(){if(!state.assets.length){toast('Primero registra equipos');return}printLabels(state.assets)}
function printLabels(items){let area=$('printArea');area.innerHTML=items.map(a=>`<div class="qrlabel"><div class="qrslot" data-qr="${esc(qrPayload(a))}"></div><b>${esc(a.name)}</b><small>${esc(a.code)}</small></div>`).join('');area.style.display='block';area.querySelectorAll('.qrslot').forEach(el=>makeQR(el,el.dataset.qr,130));setTimeout(()=>{window.print();area.style.display='none'},300)}
function scannerView(){return `<div class="topline"><div><div class="eyebrow">LECTOR ÓPTICO</div><h1>Escáner QR</h1><div class="muted">Escanea etiquetas de tus equipos con la cámara.</div></div></div><div class="card" style="max-width:650px;margin:auto"><div class="row wrap"><div><h2>Modo de escaneo</h2><div class="hint">Para registrar equipos en un evento, primero crea una salida.</div></div><button class="secondary small" onclick="enableSound()">♫ Activar pitido</button></div><div id="reader"></div><div class="actions"><button id="startScan" onclick="startScanner()">Iniciar cámara</button><button id="stopScan" class="secondary" onclick="stopScanner()" disabled>Detener</button></div><div id="scanMessage" class="hint" style="margin-top:12px">El escáner necesita permiso de cámara y una conexión HTTPS.</div><div id="scanResult" class="scanresult"></div></div><div class="card" style="max-width:650px;margin:15px auto"><h2>Escaneo manual de prueba</h2><div class="two"><input id="manualCode" placeholder="Pega el contenido de un QR"><button onclick="handleScan($('manualCode').value)">Procesar código</button></div><p class="hint">Útil para probar el flujo sin cámara.</p></div>`}
async function enableSound(){try{let C=window.AudioContext||window.webkitAudioContext,c=new C();await c.resume();beep(c);audioEnabled=true;toast('Sonido activado')}catch(e){toast('El navegador no permite activar el sonido')}}
function beep(ctx){try{let c=ctx||new (window.AudioContext||window.webkitAudioContext)();[0,.17].forEach(t=>{let o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(.001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+t+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.11);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.12)});if(!ctx)setTimeout(()=>c.close(),600)}catch(e){}}
async function startScanner(){if(scanning)return;const msg=$('scanMessage');if(!window.Html5Qrcode){msg.textContent='ERROR: no cargó la librería lectora QR. Comprueba internet y recarga la página.';return}try{scanner=new Html5Qrcode('reader',{verbose:false});await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250},aspectRatio:1.0},txt=>{try{handleScan(String(txt||'').trim())}catch(err){msg.textContent='QR detectado, pero ocurrió un error al procesarlo: '+err.message}},()=>{});scanning=true;$('startScan').disabled=true;$('stopScan').disabled=false;msg.textContent='CÁMARA ACTIVA · Centra el QR dentro del recuadro. Al leerlo aparecerá el contenido detectado.'}catch(e){msg.textContent='ERROR AL INICIAR LA CÁMARA: '+(e&&e.message?e.message:String(e))+' · Abre la web desde HTTPS en Safari y permite la cámara.'}}
async function stopScanner(){if(scanner&&scanning){try{await scanner.stop();await scanner.clear()}catch(e){}scanning=false}let b=$('startScan'),s=$('stopScan');if(b)b.disabled=false;if(s)s.disabled=true}
function handleScan(txt){txt=String(txt||'').trim();if(!txt)return;let now=Date.now();if(txt===lastScan&&now-lastScanAt<1800)return;lastScan=txt;lastScanAt=now;if(audioEnabled)beep();let id=txt.startsWith('GEAR90:')?txt.slice(7):txt;let legacyCode=id.startsWith('DEMO:')?id.slice(5):null;let a=state.assets.find(x=>x.id===id||x.code===txt||(legacyCode&&x.code===legacyCode));let box=$('scanResult');if(box){box.classList.add('show');if(!a){box.innerHTML=`<b style="color:var(--red)">QR LEÍDO, PERO NO REGISTRADO</b><div class="hint">Contenido detectado: ${esc(txt)}</div>`}else{box.innerHTML=`<b style="color:var(--green)">✓ EQUIPO RECONOCIDO: ${esc(a.name)}</b><div class="hint">${esc(a.code)} · ${esc(a.category)} · ${esc(a.status)}</div>`}}let msg=$('scanMessage');if(msg)msg.textContent='QR DETECTADO CORRECTAMENTE: '+txt;if(a&&window._eventScanId){processEventScan(a)}else if(a){toast('PIP-PIP · '+a.code)}else{toast('QR leído: no coincide con un equipo del inventario')}}
function eventsView(){return `<div class="topline"><div><div class="eyebrow">MOVIMIENTOS</div><h1>Eventos y salidas</h1><div class="muted">Control de equipos que salen y regresan del estudio.</div></div><button onclick="openEventForm()">＋ Nueva salida</button></div>${state.events.length?state.events.slice().reverse().map(e=>`<div class="card"><div class="row wrap"><div><h2>${esc(e.name)}</h2><div class="hint">${fmtDate(e.date)} · ${esc(e.location||'Sin ubicación')} · ${esc(e.responsible||'')}</div></div>${statusBadge(e.status)}</div><div class="row wrap" style="margin:12px 0"><span class="hint">${(e.items||[]).length} equipos asignados · ${(e.items||[]).filter(i=>i.returned).length} devueltos · ${(e.items||[]).filter(i=>!i.returned).length} pendientes</span><div class="actions"><button class="secondary small" onclick="openEventDetail('${e.id}')">Ver detalle</button>${e.status!=='Finalizado'?`<button class="small" onclick="startReturn('${e.id}')">Registrar devolución</button>`:''}</div></div></div>`).join(''):'<div class="empty">Todavía no hay eventos. Crea una salida para comenzar.</div>'}`}
function openEventForm(){openModal('Nueva salida / evento',`<form onsubmit="createEvent(event)"><div class="formgrid"><div class="field full"><label>Nombre del evento *</label><input name="name" required placeholder="Ej. Matrimonio Carlos y María"></div><div><label>Fecha *</label><input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></div><div><label>Ubicación</label><input name="location" placeholder="Chiriguaná, Cesar"></div><div class="field full"><label>Responsable / cliente</label><input name="responsible"></div><div class="field full"><label>Observaciones</label><textarea name="notes"></textarea></div></div><div class="actions" style="margin-top:16px"><button>Crear evento y escanear equipos</button></div></form>`)}
function createEvent(ev){ev.preventDefault();let f=new FormData(ev.target),e={id:uid(),name:f.get('name'),date:f.get('date'),location:f.get('location'),responsible:f.get('responsible'),notes:f.get('notes'),status:'Preparación',createdAt:new Date().toISOString(),items:[]};state.events.push(e);activeEventId=e.id;save();log('Evento creado: '+e.name);closeModal();page='events';render();openEventDetail(e.id)}
function openEventDetail(id){let e=state.events.find(x=>x.id===id);if(!e)return;activeEventId=id;openModal('Salida · '+e.name,`<div class="row wrap"><div><span class="badge">${esc(e.status)}</span><p class="hint">${fmtDate(e.date)} · ${esc(e.location||'')}</p></div><button onclick="scanForEvent('${id}','out')">▦ Escanear salida</button></div><h3>Equipos asignados (${e.items.length})</h3>${e.items.map(i=>{let a=state.assets.find(x=>x.id===i.assetId);return `<div class="eventitem"><div><b>${esc(i.nameSnapshot)}</b><div class="sub">${esc(i.codeSnapshot)}</div></div>${i.returned?'<span class="badge green">Devuelto</span>':'<span class="badge orange">En evento</span>'}</div>`}).join('')||'<div class="empty">Escanea los equipos que llevarás.</div>'}<div class="actions" style="margin-top:15px"><button onclick="scanForEvent('${id}','out')">Agregar equipo por QR</button><button class="secondary" onclick="closeModal();startReturn('${id}')">Devolución</button></div>`)}
function scanForEvent(id,mode){closeModal();activeEventId=id;scanMode=mode;page='scanner';render();$('scanMessage').textContent='Escanea los equipos para agregarlos a la salida seleccionada.';window._eventScanId=id;window._scanMode=mode;startScanner()}
function startReturn(id){let e=state.events.find(x=>x.id===id);if(!e)return;activeEventId=id;openModal('Devolución · '+e.name,`<p class="hint">Escanea cada equipo que está regresando. Los pendientes permanecerán marcados como no devueltos.</p><div class="row wrap"><b>Devueltos: ${e.items.filter(i=>i.returned).length} / ${e.items.length}</b><button onclick="scanForEvent('${id}','return')">▦ Escanear devolución</button></div><div style="margin-top:12px">${e.items.map(i=>`<div class="eventitem"><div><b>${esc(i.nameSnapshot)}</b><div class="sub">${esc(i.codeSnapshot)}</div></div>${i.returned?'<span class="badge green">Devuelto</span>':'<span class="badge red">Pendiente</span>'}</div>`).join('')}</div><div class="actions" style="margin-top:16px"><button onclick="closeModal();scanForEvent('${id}','return')">Abrir escáner</button><button class="secondary" onclick="closeModal()">Cerrar</button></div>`)}
function processEventScan(a){let e=state.events.find(x=>x.id===window._eventScanId);if(!e)return;let mode=window._scanMode||'out';let item=e.items.find(i=>i.assetId===a.id);if(mode==='out'){if(item){toast('Este equipo ya está en la salida');return}if(a.status!=='Disponible'){toast('Equipo no disponible: '+a.status);return}e.items.push({assetId:a.id,nameSnapshot:a.name,codeSnapshot:a.code,returned:false,outAt:new Date().toISOString()});a.status='En uso';e.status='Activo';log('Salida: '+a.name+' · '+e.name);save();toast('Equipo agregado: '+a.code)}else{if(!item){toast('Este equipo no pertenece a esta salida');return}if(item.returned){toast('Este equipo ya fue devuelto');return}item.returned=true;item.returnedAt=new Date().toISOString();a.status='Disponible';log('Devolución: '+a.name+' · '+e.name);if(e.items.every(i=>i.returned))e.status='Finalizado';else e.status='Devolución parcial';save();toast('Devolución registrada: '+a.code)}}
function maintenanceView(){return `<div class="topline"><div><div class="eyebrow">CUIDADO DE ACTIVOS</div><h1>Mantenimiento</h1><div class="muted">Registra daños, revisiones y reparaciones.</div></div><button onclick="openMaintenanceForm()">＋ Registrar mantenimiento</button></div><div class="card">${state.maintenance.length?state.maintenance.slice().reverse().map(m=>`<div class="eventitem"><div><b>${esc(m.assetName)}</b><div class="sub">${esc(m.description)} · ${fmtDate(m.date)}</div></div>${statusBadge(m.status)}</div>`).join(''):'<div class="empty">No hay mantenimientos registrados.</div>'}</div>`}
function openMaintenanceForm(){openModal('Registrar mantenimiento',`<form onsubmit="saveMaintenance(event)"><div class="stack"><div><label>Equipo</label><select name="assetId" required>${state.assets.map(a=>`<option value="${a.id}">${esc(a.name)} · ${esc(a.code)}</option>`).join('')}</select></div><div><label>Descripción</label><textarea name="description" required></textarea></div><div class="two"><div><label>Fecha</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Estado</label><select name="status"><option>En revisión</option><option>En reparación</option><option>Reparado</option><option>Fuera de servicio</option></select></div></div><div><label>Costo (COP)</label><input type="number" name="cost" min="0"></div><button>Guardar mantenimiento</button></div></form>`)}
function saveMaintenance(ev){ev.preventDefault();let f=new FormData(ev.target),a=state.assets.find(x=>x.id===f.get('assetId')),m={id:uid(),assetId:a.id,assetName:a.name,description:f.get('description'),date:f.get('date'),status:f.get('status'),cost:Number(f.get('cost')||0)};state.maintenance.push(m);if(m.status!=='Reparado')a.status='Mantenimiento';else a.status='Disponible';save();log('Mantenimiento: '+a.name);closeModal();render();toast('Mantenimiento guardado')}
function reportsView(){let totalValue=state.assets.reduce((n,a)=>n+(a.price||0),0);return `<div class="topline"><div><div class="eyebrow">INFORMES</div><h1>Reportes y datos</h1><div class="muted">Consulta y exporta tu inventario.</div></div></div><div class="grid"><div class="stat"><div class="num">${state.assets.length}</div><div class="lbl">Activos</div></div><div class="stat"><div class="num">${state.events.length}</div><div class="lbl">Eventos registrados</div></div><div class="stat"><div class="num">${state.maintenance.length}</div><div class="lbl">Mantenimientos</div></div><div class="stat"><div class="num" style="font-size:22px">${totalValue.toLocaleString('es-CO')}</div><div class="lbl">Valor registrado · COP</div></div></div><div class="card"><h2>Exportar información</h2><p class="hint">Descarga tus datos para guardarlos o migrarlos a otro dispositivo.</p><div class="actions"><button onclick="exportJSON()">Descargar copia JSON</button><button class="secondary" onclick="exportCSV()">Exportar inventario CSV</button><button class="secondary" onclick="printAllQR()">Imprimir todos los QR</button></div></div><div class="card"><h2>Historial de movimientos</h2>${state.logs.slice().reverse().map(l=>`<div class="eventitem"><div>${esc(l.text)}<div class="sub">${new Date(l.at).toLocaleString('es-CO')}</div></div></div>`).join('')||'<div class="empty">Sin movimientos registrados.</div>'}</div>`}
function settingsView(){return `<div class="topline"><div><div class="eyebrow">PREFERENCIAS</div><h1>Configuración</h1><div class="muted">Ajustes de la aplicación y respaldo de datos.</div></div></div><div class="card"><h2>Estudio</h2><label>Nombre del estudio</label><input id="studioName" value="${esc(state.settings.studio)}"><div style="margin-top:12px"><button onclick="state.settings.studio=$('studioName').value;save();toast('Configuración guardada')">Guardar cambios</button></div></div><div class="card"><h2>Respaldo y restauración</h2><p class="hint">Los datos se guardan en el almacenamiento local de este navegador. Exporta copias con frecuencia.</p><div class="actions"><button onclick="exportJSON()">Exportar respaldo</button><button class="secondary" onclick="$('importFile').click()">Importar respaldo JSON</button><input id="importFile" type="file" accept="application/json" hidden onchange="importJSON(event)"></div></div><div class="card"><h2>Información técnica</h2><p class="hint">Versión inicial para GitHub Pages. La cámara funciona en HTTPS. Esta versión guarda datos localmente en el navegador y no sincroniza automáticamente entre dispositivos.</p><span class="badge green">PWA lista para instalar</span></div>`}
function log(text){state.logs.push({id:uid(),text,at:new Date().toISOString()});if(state.logs.length>300)state.logs=state.logs.slice(-300);save()}
function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,'gear-control-90-backup.json')}
function exportCSV(){let rows=[['Código','Nombre','Categoría','Marca','Modelo','Serie','Estado','Condición','Precio COP'],...state.assets.map(a=>[a.code,a.name,a.category,a.brand,a.model,a.serial,a.status,a.condition,a.price])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'inventario-gear-control-90.csv')}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function importJSON(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.assets)||!Array.isArray(d.events))throw Error();if(confirm('Esto reemplazará los datos actuales de este navegador. ¿Continuar?')){state={...emptyState(),...d};save();render();toast('Respaldo importado')}}catch(e){alert('El archivo no parece ser un respaldo válido de GEAR CONTROL 90°')}};r.readAsText(file)}
function openBackup(){openModal('Copia de seguridad',`<p class="hint">Tus datos se guardan en este navegador. Descarga una copia periódicamente y guárdala en un lugar seguro.</p><div class="actions"><button onclick="exportJSON()">Descargar respaldo JSON</button><button class="secondary" onclick="closeModal();go('settings')">Configuración</button></div>`)}
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body>
